# presets/fleet.yaml — the `fleet` class (letters/aliases E, agent).
#
# "Done" means a config change is applied, verified against the ARTIFACT, and versioned.
# The gate therefore checks the artifact (a commit exists, dated), never the intention.
label: Agent-fleet config
done_means: a config change is applied, verified against the artifact, and versioned
harness_dir: checks
scaffold_checks: no
gate_name: commit
gate_cmd: git rev-parse --verify --quiet HEAD
ratchet_name: todo_markers
# The harness's own vendored directories are excluded: without it, a fresh class-E install
# counts the ratchet command line itself (`.goblin/goblin.yaml` holds the literal TODO|FIXME)
# and goblin-stack's own skill prose (`.hermes/skills/*/SKILL.md`), so its gate was born RED
# against a ceiling measured before those files were written (D8). The fleet's real config —
# `*.yaml`/`*.yml`/`*.sh` at the root and under `profiles/` — is still counted.
ratchet_cmd: grep -rniE '\b(TODO|FIXME)\b' --include='*.sh' --include='*.yaml' --include='*.yml' --include='*.md' --exclude-dir=.goblin --exclude-dir=.hermes . 2>/dev/null | wc -l
ratchet_ceiling: measure
replay_env: GOBLIN_PRE_COMMIT
replay_cmd: node checks/{name}.mjs
runtime_data: .goblin/state.json
# A fleet config has no client surface; the secret family still matters (a profile file is one
# `git add` away from a live token), so SC-01/SC-02 are the rows that bite here.
sec_gitignore_family: yes
sec_build_output: ""
sec_audit_cmd: ""
sec_audit_max_age_days: 90
sec_waiver_max_age_days: 180
sec_write_routes: ""
perf_metric: ""
perf_cmd: ""
perf_baseline_commit: ""
perf_baseline_value: 0
perf_measured: ""
perf_host_gate: ""
notes: the order is dry-run, then one profile, then verify, then apply-all.
# The ban list this class turns on (G5). An unlisted ban SKIPs with a reason.
bans: BN-02

# The loop ceiling (G2, LP-03): the most turns ONE loop record may declare in its budget.
# The same number for every class - a ceiling, not a per-class policy. 20 is the engine default.
loop_max_turns_ceiling: 20
