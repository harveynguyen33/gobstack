# presets/C-game.yaml — class C: game.
#
# "Done" means a suite green in the Editor AND a human feel verdict. The verdict is a
# first-class deliverable, which is why this class requires the review-panel part: the panel
# is the review, and it is the one part that cannot be automated away.
label: Game
done_means: a suite green in the Editor and a human feel verdict, the verdict being a first-class deliverable
harness_dir: checks
scaffold_checks: yes
gate_name: commit
gate_cmd: git rev-parse --verify --quiet HEAD
ratchet_name: todo_markers
ratchet_cmd: grep -rniE '\b(TODO|FIXME)\b' --include='*.cs' --include='*.ts' --include='*.js' . 2>/dev/null | wc -l
ratchet_ceiling: measure
replay_env: GOBLIN_PRE_COMMIT
replay_cmd: node checks/{name}.mjs
runtime_data: .goblin/state.json
notes: the Editor suite is a host gate, not a hermetic one - declare it as such and do not expect it to run in CI.
