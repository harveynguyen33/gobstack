# presets/service.yaml — the `service` class (letter/alias B).
#
# "Done" means a contract (schema, route, API) is unchanged, or the change is intentional
# and migrated. The class turns off the REPLAY and the PR gate, because a config repo has no
# pre-change tree to pin and no remote to gate against.
label: Service / configuration
done_means: a contract (schema, route, API) is unchanged, or the change is intentional and migrated
harness_dir: checks
scaffold_checks: no
gate_name: commit
gate_cmd: git rev-parse --verify --quiet HEAD
ratchet_name: todo_markers
ratchet_cmd: grep -rniE '\b(TODO|FIXME)\b' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.py' . 2>/dev/null | wc -l
ratchet_ceiling: measure
replay_env: GOBLIN_PRE_COMMIT
replay_cmd: node checks/{name}.mjs
runtime_data: .goblin/state.json
# A service has real inputs and real dependencies, so the security rows bite here.
sec_gitignore_family: yes
sec_build_output: dist
sec_audit_cmd: npm audit --json
sec_audit_max_age_days: 90
sec_waiver_max_age_days: 180
sec_write_routes: src app
# No perf metric is declared for this class by default (G4 D1): build bytes are measurable, but
# latency - the number a service is judged on - is a HOST gate (`curl -w '%{time_total}'`), and a
# host gate cannot be a hermetic ratchet. Declare metric+cmd here the day you pick a build metric.
perf_metric: ""
perf_cmd: ""
perf_baseline_commit: ""
perf_baseline_value: 0
perf_measured: ""
perf_host_gate: ""
notes: declare the schema-shape snapshot as the gate; content is optional, schema is required.
# The ban list this class turns on (G5). An unlisted ban SKIPs with a reason.
bans: ""

# The loop ceiling (G2, LP-03): the most turns ONE loop record may declare in its budget.
# The same number for every class - a ceiling, not a per-class policy. 20 is the engine default.
loop_max_turns_ceiling: 20
