# presets/D-knowledge.yaml — class D: knowledge / research.
#
# "Done" means a question is answered with sources and the answer is findable. A research
# note is not a spec, so the SPEC part is OFF, not optional. So are the REPLAY and the PR
# gate: there is no pre-change tree to pin and no compiled artifact to gate.
# Use --archive for an input directory that is not a build target at all.
label: Knowledge / research
done_means: a question is answered with sources and the answer is findable
harness_dir: checks
scaffold_checks: no
gate_name: commit
gate_cmd: git rev-parse --verify --quiet HEAD
ratchet_name: ""
ratchet_cmd: ""
ratchet_ceiling: 0
replay_env: GOBLIN_PRE_COMMIT
replay_cmd: node checks/{name}.mjs
runtime_data: .goblin/state.json
# A knowledge repo has no client surface and no dependency manifest, so SC-03's build-output
# clause, SC-05..SC-08 skip with a reason. The SECRET FAMILY is not one of those: a note file is
# one `git add` away from a pasted token, so SC-02 is required here too and the installer writes
# the family into `.gitignore` for every class.
sec_gitignore_family: yes
sec_build_output: ""
sec_audit_cmd: ""
sec_audit_max_age_days: 90
sec_waiver_max_age_days: 180
sec_write_routes: ""
perf_metric: ""
perf_cmd: ""
perf_baseline_commit: ""
perf_baseline_value: 0
perf_measured: ""
perf_host_gate: ""
notes: mark every unsourced claim [unverified]; the freshness/lint gate over notes is optional.
# The ban list this class turns on (G5). An unlisted ban SKIPs with a reason.
bans: ""

# The loop ceiling (G2, LP-03): the most turns ONE loop record may declare in its budget.
# The same number for every class - a ceiling, not a per-class policy. 20 is the engine default.
loop_max_turns_ceiling: 20
